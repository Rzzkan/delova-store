# Delova Store — Hostinger Docker Manager / `docker compose up -d`
# Ganti 5 nilai bertanda GANTI_ langsung di file ini (atau isi lewat Environment / .env).
services:
  app:
    image: ghcr.io/rzzkan/delova-store:latest
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      default:
        # Alamat unik: nama "app" juga dipakai proyek lain di VPS yang sama (mis. warehouse) dan
        # membuat Docker menjawab bergantian. Caddy & cron memakai "delova-app".
        aliases: [delova-app]
    volumes:
      - delova_data:/app/data
    environment:
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN:-GANTI_domainmu.com}
      NEXT_PUBLIC_WA_NUMBER: ${WA_NUMBER:-GANTI_628xxxxxxxxxx}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-GANTI_password_admin}
      SESSION_SECRET: ${SESSION_SECRET:-GANTI_string_acak_panjang}
      CRON_SECRET: ${CRON_SECRET:-GANTI_string_acak_lain}
      # CMS blog/panduan/koleksi di /cms — isi agar akun pertama dibuat otomatis (jangan biarkan kosong di internet)
      CMS_ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:-}
      CMS_ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:-}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-}
      MCP_TOKEN: ${MCP_TOKEN:-}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      SHOPEE_ENV: ${SHOPEE_ENV:-live}
      SHOPEE_REDIRECT_URL: https://${DOMAIN:-GANTI_domainmu.com}/api/shopee/callback
      SHOPEE_PUSH_KEY: ${SHOPEE_PUSH_KEY:-}
      SHOPEE_WEBHOOK_URL: https://${DOMAIN:-GANTI_domainmu.com}/api/shopee/webhook
      NEXT_PUBLIC_META_PIXEL_ID: ${META_PIXEL_ID:-}
      NEXT_PUBLIC_TIKTOK_PIXEL_ID: ${TIKTOK_PIXEL_ID:-}
      NEXT_PUBLIC_GA4_ID: ${GA4_ID:-}
      NEXT_PUBLIC_GSC_VERIFICATION: ${GSC_VERIFICATION:-}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?isi DOMAIN di file .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:-GANTI_string_acak_lain}
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 21600; curl -fsS -m 300 -H \"Authorization: Bearer $$CRON_SECRET\" http://delova-app:3000/api/shopee/sync || echo sync-gagal; done"]

volumes:
  delova_data:
  caddy_data:
  caddy_config:
